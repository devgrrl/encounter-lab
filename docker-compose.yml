services:
  api:
    init: true
    build:
      context: .
      dockerfile: src/EncounterLab.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EncounterLab: Data Source=/data/encounterlab.db
    volumes:
      - encounter-data:/data
    ports:
      - "5000:8080"
  web:
    init: true
    build:
      context: .
      dockerfile: src/EncounterLab.Web/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  encounter-data:
