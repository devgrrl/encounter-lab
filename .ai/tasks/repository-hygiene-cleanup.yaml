id: repository-hygiene-cleanup-001
objective: >
  Fix the proprietary license mismatch, delete dead code and stale/inaccurate
  changelog documentation, and confirm no remaining doc references anything
  that no longer exists.
scope:
  allow:
    - LICENSE
    - EVAL_LICENSE_ADDENDUM.md
    - FIXES_V5.md
    - FIXES_V6.md
    - FIXES_V7.md
    - FIXES_V8.md
    - FIXES_V9.md
    - FIXES_V10.md
    - FIXES_V11.md
    - RELEASE_NOTES_PHYSICAL_DICE.md
    - V9_CORRECTIVE_PATCH.md
    - src/EncounterLab.Web/src/components/RenderedDice.tsx
    - src/EncounterLab.Web/src/components/PhysicalDiceTray.tsx
    - src/EncounterLab.Web/src/components/diceGeometry.ts
    - src/EncounterLab.Web/src/components/diceGeometry.test.ts
  deny:
    - src/EncounterLab.Domain/**
acceptance:
  - LICENSE reflects proprietary all-rights-reserved with a separate, narrow evaluation grant for the named reviewer, not MIT
  - no orphaned/unimported source file remains (verified by grep before deletion, not assumed)
  - no remaining doc references a deleted file
validation:
  - grep for references to each deleted file across the repo before removal
  - grep sweep for stale terms (jsdelivr, RenderedDice, PhysicalDiceTray, diceGeometry) across all *.md after removal
risk: low
approval:
  before_merge: human
